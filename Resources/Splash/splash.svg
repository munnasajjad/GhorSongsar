<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 414 896" width="100%" height="100%">
  <defs>
    <!-- ব্যাকগ্রাউন্ড গ্রেডিয়েন্ট -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F9F8F3"/>
      <stop offset="100%" stop-color="#EAE5D9"/>
    </linearGradient>

    <!-- আইকন ব্যাকগ্রাউন্ড গ্রেডিয়েন্ট -->
    <linearGradient id="icon-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A7CA5"/>
      <stop offset="100%" stop-color="#1B4965"/>
    </linearGradient>

    <!-- গোল্ডেন শাইন -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5A93C"/>
      <stop offset="100%" stop-color="#BD7A22"/>
    </linearGradient>

    <!-- ড্রপ শ্যাডো -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- ব্যাকগ্রাউন্ড -->
  <rect width="414" height="896" fill="url(#bg-grad)"/>

  <!-- মেইন কন্টেইনার / ইলুস্ট্রেশন সেন্টার -->
  <g transform="translate(0, 80)">

    <!-- সার্কুলার আইকন বেস -->
    <circle cx="207" cy="220" r="110" fill="url(#icon-bg)" filter="url(#shadow)"/>
    <circle cx="207" cy="220" r="102" fill="none" stroke="url(#gold-grad)" stroke-width="4"/>

    <!-- ঘর ও হাতের ইলুস্ট্রেশন (আইকনের ভেতরের এলিমেন্ট) -->
    <g transform="translate(132, 135)">
      <!-- বাড়ি -->
      <path d="M 40,75 L 75,45 L 110,75 L 110,105 L 40,105 Z" fill="#EAE5D9"/>
      <polygon points="75,35 30,72 38,78 75,47 112,78 120,72" fill="url(#gold-grad)"/>
      <!-- জানালা -->
      <rect x="65" y="65" width="20" height="20" rx="2" fill="#3A7CA5"/>
      <line x1="75" y1="65" x2="75" y2="85" stroke="#EAE5D9" stroke-width="2"/>
      <line x1="65" y1="75" x2="85" y2="75" stroke="#EAE5D9" stroke-width="2"/>

      <!-- পাতা (গাছ) -->
      <path d="M 100,65 C 100,45 125,40 125,40 C 125,40 125,60 105,68 Z" fill="#2A9D8F"/>
      <path d="M 105,62 C 115,50 135,52 135,52 C 135,52 130,68 112,68 Z" fill="#E9C46A"/>

      <!-- যত্নশীল হাত -->
      <path d="M 25,105 C 45,120 75,130 115,115 C 125,110 130,102 120,100 C 105,98 85,110 60,100 C 45,94 30,98 25,105 Z" fill="url(#gold-grad)"/>
    </g>

    <!-- অ্যাপের নাম (টাইটেল) -->
    <text x="207" y="420" text-anchor="middle" font-family="'Kohinoor Bangla', 'Kalpurush', 'Hind Siliguri', sans-serif" font-weight="bold" font-size="38" fill="#1B4965">
      ঘর সংসার
    </text>

    <!-- ট্যাগলাইন -->
    <text x="207" y="465" text-anchor="middle" font-family="'Kohinoor Bangla', 'Kalpurush', 'Hind Siliguri', sans-serif" font-size="20" fill="#555555" letter-spacing="1">
      আপনার সুখী গৃহস্থালীর সঙ্গী
    </text>

  </g>

  <!-- বটম সেকশন / ভার্সন ইনফো -->
  <text x="207" y="820" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#888888" letter-spacing="2">
    VERSION 1.0
  </text>
</svg>
